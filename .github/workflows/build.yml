
name: Build Aram Cafe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Extract project
        run: unzip -q Aram_Cafe_Cloud_Build_Project.zip -d project

      - name: Build APK
        run: ./gradle-8.9/bin/gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Aram-Cafe-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
